name: Automated Job Scraper Engine

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  # This makes the yellow warning go away completely!
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out your repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Upgraded to version 24!

      - name: Install Project Dependencies
        run: npm install

      - name: Generate Database Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Scraper Robot
        run: node scripts/scrape.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
